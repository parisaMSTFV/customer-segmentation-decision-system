name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install uv==0.11.33
      - run: uv sync --all-extras --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: MPLCONFIGDIR=.matplotlib uv run pytest
      - run: uv run python scripts/check_sensitive.py
      - run: MPLCONFIGDIR=.matplotlib uv run python -m customer_segmentation.cli smoke
      - run: >-
          MPLCONFIGDIR=.matplotlib uv run python -m customer_segmentation.cli fit
          --input data/synthetic/customer_features.csv
          --model-dir artifacts/model
          --output-dir artifacts/fit-fixture
      - run: >-
          MPLCONFIGDIR=.matplotlib uv run python -m customer_segmentation.cli score
          --input data/synthetic/customer_features.csv
          --model-dir artifacts/model
          --output-dir artifacts/score-fixture
          --previous-assignments artifacts/fit-fixture/customer_segments.csv
