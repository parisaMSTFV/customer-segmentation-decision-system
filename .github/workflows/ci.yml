name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check . && python -m ruff format --check .
      - run: MPLCONFIGDIR=.matplotlib python -m pytest
      - run: python scripts/check_sensitive.py
      - run: MPLCONFIGDIR=.matplotlib python -m customer_segmentation.cli smoke

